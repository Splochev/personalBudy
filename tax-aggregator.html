<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>НАП Данъчен Агрегатор — Trading 212</title>
    <link rel="icon" type="image/svg+xml" href="./tax-aggregator.png" />
    <style>
      /* ── DESIGN TOKENS (from PersonalBuddy) ─────────────────────────── */
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #252833;
        --surface3: #2f3342;
        --border: #353849;
        --text: #e8eaf0;
        --text2: #9ca3b8;
        --text3: #6b7280;
        --accent: #22c55e;
        --accent-h: #16a34a;
        --accent-bg: rgba(34, 197, 94, 0.1);
        --danger: #ef4444;
        --green: #22c55e;
        --red: #ef4444;
        --yellow: #fbbf24;
        --cyan: #22d3ee;
        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        --trans: all 0.2s ease;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 14px; }
      body {
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        padding: 0 0 80px;
      }

      /* ── TOPBAR ──────────────────────────────────────────────────────── */
      #topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.4px;
      }
      .logo svg { width: 22px; height: 22px; }
      .topbar-subtitle {
        font-size: 0.75rem;
        color: var(--text3);
        margin-left: 4px;
      }

      /* ── PAGE BODY ───────────────────────────────────────────────────── */
      .page-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px;
      }

      /* ── UPLOAD ZONE ─────────────────────────────────────────────────── */
      .upload-zone {
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        padding: 36px 32px;
        text-align: center;
        cursor: pointer;
        transition: var(--trans);
        margin-bottom: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .upload-zone:hover { border-color: var(--accent); background: var(--surface2); }
      .upload-zone.dragging { border-color: var(--accent); background: var(--accent-bg); }
      .upload-zone input { display: none; }
      .upload-icon { font-size: 30px; margin-bottom: 10px; }
      .upload-label { font-size: 0.875rem; color: var(--text2); }
      .upload-label strong { color: var(--accent); }
      .upload-hint { margin-top: 4px; font-size: 0.75rem; color: var(--text3); }
      .file-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 5px 14px;
        background: var(--accent-bg);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 20px;
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
      }

      /* ── SUMMARY CARDS ───────────────────────────────────────────────── */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        box-shadow: var(--shadow);
      }
      .card-label {
        font-size: 0.6875rem;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .card-value { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.5px; }
      .card-value.pos { color: var(--green); }
      .card-value.neg { color: var(--red); }
      .card-value.neu { color: var(--cyan); }
      .card-sub { font-size: 0.6875rem; color: var(--text3); margin-top: 4px; }

      /* ── TABS ────────────────────────────────────────────────────────── */
      .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
      .tab-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text2);
        padding: 7px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-family: inherit;
        cursor: pointer;
        transition: var(--trans);
        font-weight: 600;
      }
      .tab-btn:hover { background: var(--surface2); color: var(--text); }
      .tab-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }

      /* ── SECTIONS ────────────────────────────────────────────────────── */
      .section { margin-bottom: 32px; }
      .section-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .section-badge {
        background: var(--accent-bg);
        color: var(--accent);
        border: 1px solid rgba(34, 197, 94, 0.25);
        font-size: 0.625rem;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: none;
      }

      /* ── YEAR BLOCK ──────────────────────────────────────────────────── */
      .year-block { margin-bottom: 40px; }
      .year-header {
        font-size: 1.375rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 20px;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .year-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ── TABLES ──────────────────────────────────────────────────────── */
      .table-wrap {
        overflow-x: auto;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
      thead th {
        background: var(--surface2);
        color: var(--text3);
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 600;
        padding: 10px 12px;
        text-align: right;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        cursor: pointer;
        transition: var(--trans);
      }
      thead th:hover { color: var(--text); }
      thead th.left { text-align: left; }
      tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
      tbody tr:last-child { border-bottom: none; }
      tbody tr:hover td { background: var(--surface2); }
      tbody td {
        padding: 9px 12px;
        text-align: right;
        background: var(--surface);
        font-size: 0.75rem;
        white-space: nowrap;
        color: var(--text2);
      }
      tbody td.left { text-align: left; font-family: inherit; color: var(--text); }
      tbody td.ticker {
        font-weight: 700;
        color: var(--accent);
        text-align: left;
      }
      .total-row td {
        background: var(--surface2) !important;
        font-weight: 700;
        color: var(--text);
        border-top: 2px solid var(--border);
      }
      .profit-val { color: var(--green); }
      .loss-val   { color: var(--red); }
      .zero-val   { color: var(--text3); }
      .highlight td { background: rgba(239, 68, 68, 0.04) !important; }

      /* ── RAW TAB CONTROLS ────────────────────────────────────────────── */
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .search-input {
        flex: 1; min-width: 200px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 7px 12px;
        color: var(--text);
        font-size: 0.8125rem;
        font-family: inherit;
        outline: none;
        transition: var(--trans);
      }
      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      }
      select.filter-sel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 7px 10px;
        color: var(--text);
        font-size: 0.8125rem;
        font-family: inherit;
        outline: none;
        transition: var(--trans);
        cursor: pointer;
      }
      select.filter-sel:focus { border-color: var(--accent); }

      /* ── BUTTONS ─────────────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 0.8125rem;
        font-family: inherit;
        cursor: pointer;
        border: none;
        transition: var(--trans);
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover { background: var(--accent-h); }
      .btn-ghost {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text2);
      }
      .btn-ghost:hover { background: var(--surface2); color: var(--text); }

      .row-count { font-size: 0.75rem; color: var(--text3); }

      /* ── WARNING BANNER ──────────────────────────────────────────────── */
      .warn {
        background: rgba(251, 191, 36, 0.08);
        border: 1px solid rgba(251, 191, 36, 0.25);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        font-size: 0.8125rem;
        color: var(--yellow);
        margin-bottom: 16px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      /* ── EMPTY STATES ────────────────────────────────────────────────── */
      .empty-text { color: var(--text3); font-size: 0.8125rem; padding: 14px 0; }
      #results { display: none; }

      /* ── SCROLL TO TOP ───────────────────────────────────────────────── */
      .scroll-top-btn {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 40px;
        height: 40px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
        z-index: 1000;
        transition: var(--trans);
      }
      .scroll-top-btn:hover { background: var(--accent-h); transform: translateY(-2px); }
      .scroll-top-btn.show { display: flex; }

      /* ── DETAIL SUMMARY ──────────────────────────────────────────────── */
      details summary { cursor: pointer; color: var(--text3); font-size: 0.75rem; }
      details[open] summary { color: var(--text2); }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      #results { animation: fadeIn 0.25s ease; }

      /* ── NAP FILL-IN BLOCK ───────────────────────────────────────────── */
      .nap {
        background: var(--surface);
        border: 1px solid rgba(34, 197, 94, 0.35);
        border-radius: var(--radius);
        padding: 18px 18px 6px;
        margin-bottom: 32px;
        box-shadow: var(--shadow);
      }
      .nap-head { font-size: 0.9375rem; font-weight: 700; color: var(--text); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      .nap-head strong { color: var(--accent); }
      .nap-partial {
        font-size: 0.6875rem; font-weight: 600; color: var(--yellow);
        background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.25);
        padding: 2px 8px; border-radius: 10px;
      }
      .nap-hint { font-size: 0.75rem; color: var(--text3); margin: 4px 0 6px; }
      .nap-title { font-size: 0.8125rem; font-weight: 700; color: var(--text2); margin: 18px 0 8px; }
      .nap-note { font-size: 0.75rem; color: var(--text3); margin: 8px 0 4px; }
      .nap-note strong { color: var(--text); }
      .nap-table thead th {
        background: #16324f; color: #fff; text-transform: none; letter-spacing: 0;
        font-size: 0.6875rem; text-align: center; white-space: normal; cursor: default;
        border: 1px solid var(--border);
      }
      .nap-table thead tr.nap-colnum th { background: var(--surface2); color: var(--text3); font-weight: 700; padding: 4px; }
      .nap-table tbody td { border: 1px solid var(--border); font-size: 0.8125rem; }
      .nap-table tbody td.c { text-align: center; }
      .nap-table tr.nap-calc td, .nap-table td.nap-calc-cell { background: rgba(251, 191, 36, 0.06); color: var(--text); }
      .nap-val {
        display: inline-block; min-width: 64px; text-align: right;
        background: var(--bg); color: #fff; border: 1px solid var(--accent);
        border-radius: 4px; padding: 2px 8px; font-weight: 700; cursor: copy;
        font-variant-numeric: tabular-nums; transition: var(--trans);
      }
      .nap-table td.left .nap-val, .nap-table td.c .nap-val { text-align: left; min-width: 0; }
      .nap-val:hover { background: var(--accent-bg); }
      .nap-val.copied { background: var(--accent); color: #fff; }
      .nap-sub { font-size: 0.6875rem; color: var(--text3); font-weight: 400; }
    </style>
  </head>
  <body>

    <!-- ══ TOPBAR ══════════════════════════════════════════════════════════ -->
    <header style="padding: 24px 16px; border-bottom: 1px solid var(--border)">
      <div style="max-width: 1200px; margin: 0 auto">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
          "
        >
          <div class="logo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <path d="M8 21h8M12 17v4" />
              <path d="M7 8h2v5H7zM11 6h2v7h-2zM15 10h2v3h-2z" />
            </svg>
            <div
              style="display: flex; flex-direction: row; line-height: 1.1; gap: 16px; align-items: baseline;">
              <p>
                НАП Агрегатор
              </p>
              <p class="topbar-subtitle">Trading 212 CSV → Приложения към чл. 50 (BGN до 2025, EUR от 2026)</p>
            </div>
          </div>
          <a
            href="index.html"
            class="btn btn-ghost"
            style="text-decoration: none"
          >
            <svg
              style="width: 16px; height: 16px"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 12h18M3 12l9-9m-9 9l9 9" />
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </header>


    <!-- ══ PAGE ════════════════════════════════════════════════════════════ -->
    <div class="page-inner">

      <!-- Upload zone -->
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".csv" multiple />
        <div class="upload-icon">📂</div>
        <div class="upload-label"><strong>Качи CSV</strong> от Trading 212 (или плъзни тук)</div>
        <div class="upload-hint">Поддържа множество файлове</div>
        <div id="fileBadge" style="display:none" class="file-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="fileNames"></span>
        </div>
      </div>

      <!-- Results -->
      <div id="results">

        <!-- Summary cards -->
        <div class="cards" id="summaryCards"></div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('tax')">📋 Данъчни таблици</button>
          <button class="tab-btn" onclick="switchTab('raw')">🔍 Суров CSV</button>
        </div>

        <!-- Tax tab -->
        <div class="tab-panel active" id="tab-tax">
          <div id="taxOutput"></div>
        </div>

        <!-- Raw CSV tab -->
        <div class="tab-panel" id="tab-raw">
          <div class="controls">
            <input class="search-input" id="csvSearch" placeholder="Търси тикер, ISIN…" oninput="renderCsvTable()" />
            <select class="filter-sel" id="actionFilter" onchange="renderCsvTable()">
              <option value="">Всички операции</option>
              <option value="Market buy">Покупки</option>
              <option value="Market sell">Продажби</option>
              <option value="Stop sell">Stop sell</option>
            </select>
            <button class="btn btn-primary" id="exportCsvBtn">📥 Експорт CSV</button>
            <span class="row-count" id="rowCount"></span>
          </div>
          <div class="table-wrap">
            <table id="csvTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div><!-- /results -->
    </div><!-- /page-inner -->

    <button class="scroll-top-btn" id="scrollTopBtn" title="Към началото">↑</button>

    <script>
    // ── Constants ──────────────────────────────────────────────────────────
    const EURO_TO_BGN = 1.95583;
    const DEBUG = false;
    const FALLBACK_RATES = { USD: 1.10, GBP: 0.86 };
    const BUY_ACTIONS  = new Set(['Market buy', 'Limit buy', 'Stop buy', 'Stop limit buy']);
    const SELL_ACTIONS = new Set(['Market sell', 'Limit sell', 'Stop sell', 'Stop limit sell']);

    // ── DOM refs ───────────────────────────────────────────────────────────
    const fileInput    = document.getElementById('fileInput');
    const uploadZone   = document.getElementById('uploadZone');
    const results      = document.getElementById('results');
    const summaryCards = document.getElementById('summaryCards');
    const taxOutput    = document.getElementById('taxOutput');

    // ── Upload zone ────────────────────────────────────────────────────────
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragging'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragging'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault(); uploadZone.classList.remove('dragging');
      fileInput.files = e.dataTransfer.files;
      processFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', e => processFiles(Array.from(e.target.files)));

    document.getElementById('scrollTopBtn').addEventListener('click', () =>
      window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () =>
      document.getElementById('scrollTopBtn').classList.toggle('show', window.scrollY > 300));

    // ── Main entry point ───────────────────────────────────────────────────
    async function processFiles(files) {
      if (!files.length) return;
      document.getElementById('fileNames').textContent = files.map(f => f.name).join(', ');
      document.getElementById('fileBadge').style.display = 'inline-flex';

      // Every T212 export has its own column layout (columns are added/reordered between
      // years), so map each row by its own file's header and merge into one header.
      const header = [];
      const data = [];
      const seen = new Set();
      for (const f of files) {
        const rows = parseCSV(await f.text());
        const fileHeader = rows[0].map(h => h.trim());
        fileHeader.forEach(h => { if (h && !header.includes(h)) header.push(h); });
        rows.slice(1).forEach(r => {
          if (r.length < 2) return;
          const obj = {};
          fileHeader.forEach((h, i) => { obj[h] = (r[i] ?? '').trim(); });
          const key = obj.ID || r.join(',');
          if (seen.has(key)) return; // overlapping exports
          seen.add(key);
          data.push(obj);
        });
      }

      const TIME   = header.includes('Time (UTC)') ? 'Time (UTC)' : 'Time';
      const num    = v => parseFloat(String(v || '').replace(',', '.')) || 0;
      const dayOf  = r => (r[TIME] || '').slice(0, 10);
      const yearOf = r => parseInt((r[TIME] || '').slice(0, 4), 10);
      data.sort((a, b) => (a[TIME] || '').localeCompare(b[TIME] || ''));

      // Daily "units of currency per 1 EUR", taken from T212's own rates on trades booked
      // in a BGN/EUR account (there Exchange rate = price currency per account currency).
      const dailyRates = {};
      data.forEach(r => {
        if (!BUY_ACTIONS.has(r.Action) && !SELL_ACTIONS.has(r.Action)) return;
        let cur = r['Currency (Price / share)'];
        const acc = r['Currency (Total)'];
        let rate = num(r['Exchange rate']);
        if (!rate || (acc !== 'EUR' && acc !== 'BGN')) return;
        if (cur === 'GBX') { cur = 'GBP'; rate /= 100; }
        if (cur === 'EUR' || cur === 'BGN') return;
        if (acc === 'BGN') rate *= EURO_TO_BGN;
        (dailyRates[cur] = dailyRates[cur] || {})[dayOf(r)] = rate;
      });
      const rateEntries = {};
      Object.entries(dailyRates).forEach(([cur, m]) => {
        rateEntries[cur] = Object.entries(m).map(([d, v]) => [Date.parse(d), v]);
      });
      const missingRates = new Set();
      const ratePerEUR = (cur, day) => {
        const list = rateEntries[cur];
        if (!list || !list.length) { missingRates.add(cur); return FALLBACK_RATES[cur] || 1; }
        const t = Date.parse(day);
        let best = list[0];
        for (const e of list) if (Math.abs(e[0] - t) < Math.abs(best[0] - t)) best = e;
        return best[1];
      };
      const toEUR = (amount, cur, day) => {
        if (!amount || !cur || cur === 'EUR') return amount;
        if (cur === 'BGN') return amount / EURO_TO_BGN;
        if (cur === 'GBX') return amount / 100 / ratePerEUR('GBP', day);
        return amount / ratePerEUR(cur, day);
      };

      // Amount in the instrument's price currency (GBX → GBP), using the trade's own exchange rate
      const toPriceCurrency = (total, acc, r, day) => {
        let cur = r['Currency (Price / share)'] || acc;
        let rate = num(r['Exchange rate']);
        if (cur === 'GBX') { cur = 'GBP'; rate /= 100; }
        if (cur === acc) return [total, cur];
        if (rate > 0) return [total * rate, cur];
        const e = toEUR(total, acc, day);
        return [cur === 'EUR' ? e : cur === 'BGN' ? e * EURO_TO_BGN : e * ratePerEUR(cur, day), cur];
      };

      const years  = {};
      const Y      = y => years[y] = years[y] || { taxable: {}, dividends: [], holdings: [] };
      const names  = {};
      // Weighted-average cost per ticker, in EUR at the purchase-date rate. T212's own Result
      // column is not used: it excludes the FX fees and, for sells paid out in USD/GBP, ignores
      // the EUR/USD move since purchase.
      const pos    = {}; // ticker -> { shares, eur, foreign, fcur, firstTime, isin }
      const missingHistory = new Set();
      let snapYear = null;

      const snapshot = y => {
        Object.entries(pos).forEach(([ticker, p]) => {
          if (p.shares < 1e-6) return;
          Y(y).holdings.push({
            ticker, name: names[ticker], isin: p.isin, shares: p.shares, firstDate: p.firstTime,
            totalEUR: p.eur, foreign: p.foreign, fcur: p.fcur
          });
        });
      };

      data.forEach(r => {
        const y = yearOf(r); if (!y) return;
        const isBuy = BUY_ACTIONS.has(r.Action), isSell = SELL_ACTIONS.has(r.Action);
        const ticker = r.Ticker, day = dayOf(r);
        const acc = r['Currency (Total)'];
        const total = num(r.Total), shares = num(r['No. of shares']);
        if (ticker) names[ticker] = names[ticker] || r.Name || ticker;

        if ((r.Action || '').startsWith('Dividend')) {
          // T212 "Total" is the gross dividend; withholding tax is reported separately
          Y(y).dividends.push({
            ticker, name: r.Name, isin: r.ISIN, day,
            grossEUR: toEUR(total, acc, day),
            whtEUR: toEUR(num(r['Withholding tax']), r['Currency (Withholding tax)'], day)
          });
          return;
        }
        if (!ticker || (!isBuy && !isSell)) return;

        if (snapYear !== null && y > snapYear) for (let s = snapYear; s < y; s++) snapshot(s);
        snapYear = y;

        const p = pos[ticker] = pos[ticker] || { shares: 0, eur: 0, foreign: 0, fcur: '', firstTime: '', isin: r.ISIN };

        // Buy Total includes the FX fee, sell Total is net of it — so fees reduce the gain
        if (isBuy) {
          if (p.shares < 1e-6) p.firstTime = r[TIME];
          const [amt, fcur] = toPriceCurrency(total, acc, r, day);
          p.shares += shares;
          p.eur += toEUR(total, acc, day);
          p.foreign += amt; p.fcur = fcur;
          return;
        }

        const sellEUR = toEUR(total, acc, day);
        let costEUR;
        if (p.shares + 1e-6 >= shares) {
          const frac = Math.min(shares / p.shares, 1);
          costEUR = p.eur * frac;
          p.eur -= costEUR; p.foreign -= p.foreign * frac; p.shares -= shares;
        } else {
          // Bought before the first uploaded CSV — fall back to T212's Result
          missingHistory.add(ticker);
          costEUR = sellEUR - toEUR(num(r.Result), r['Currency (Result)'] || acc, day);
          p.eur = 0; p.foreign = 0; p.shares = 0;
        }
        if (p.shares < 1e-6) { p.shares = 0; p.eur = 0; p.foreign = 0; }

        const profit = sellEUR - costEUR;
        const bucket = Y(y).taxable;
        const t = bucket[ticker] = bucket[ticker] || { sellEUR: 0, buyEUR: 0, profit: 0, loss: 0, deals: 0 };
        t.sellEUR += sellEUR; t.buyEUR += costEUR; t.deals++;
        if (profit >= 0) t.profit += profit; else t.loss -= profit;
      });
      if (snapYear !== null) snapshot(snapYear);

      const sumDeals = b => Object.values(b).reduce((s, t) => ({
        sell: s.sell + t.sellEUR, buy: s.buy + t.buyEUR, profit: s.profit + t.profit, loss: s.loss + t.loss
      }), { sell: 0, buy: 0, profit: 0, loss: 0 });
      const lastDay  = data.length ? dayOf(data[data.length - 1]) : '';
      const fmtDate  = d => d ? d.slice(0, 10).split('-').reverse().join('.') : '—';
      const country  = isin => (isin || '').slice(0, 2) || '—';
      const yearList = Object.keys(years).map(Number).sort((a, b) => a - b);

      // Everything below is in the return's currency (BGN up to 2025, EUR from 2026),
      // rounded to stotinki/cents the way the NAP portal computes each row.
      const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
      const summary = {};
      yearList.forEach(y => {
        const yd = years[y];
        const conv = v => currencyOf(y) === 'BGN' ? v * EURO_TO_BGN : v;
        const tx = sumDeals(yd.taxable);
        // Приложение 5, Таблица 2: к. 3–6, ред 5 = печалби − загуби, ред 6 = 10% разходи, ред 7 = облагаем доход
        const c3 = r2(conv(tx.sell)), c4 = r2(conv(tx.buy)), c5 = r2(conv(tx.profit)), c6 = r2(conv(tx.loss));
        const row5 = r2(Math.max(c5 - c6, 0));
        const row6 = r2(row5 * 0.10);
        const row7 = r2(row5 - row6);
        const dealsTax = r2(row7 * 0.10);

        // Приложение 8, Част III — one row per payer
        const payers = {};
        yd.dividends.forEach(d => {
          const k = d.ticker || d.name;
          const pr = payers[k] = payers[k] || { name: d.name || d.ticker, isin: d.isin, grossEUR: 0, whtEUR: 0 };
          pr.grossEUR += d.grossEUR; pr.whtEUR += d.whtEUR;
        });
        const divRows = Object.values(payers).map(pr => {
          const gross = r2(conv(pr.grossEUR)), wht = r2(conv(pr.whtEUR));
          const allowed = r2(Math.min(wht, gross * 0.05));
          return { ...pr, gross, wht, allowed, due: r2(Math.max(gross * 0.05 - allowed, 0)) };
        });
        const divTax = r2(divRows.reduce((t, d) => t + d.due, 0));

        // Приложение 8, Част I — one row per country and currency
        const groups = {};
        yd.holdings.forEach(h => {
          const k = countryName(h.isin) + '|' + h.fcur;
          const g = groups[k] = groups[k] || { country: countryName(h.isin), fcur: h.fcur, shares: 0, foreign: 0, eur: 0, first: h.firstDate, tickers: [] };
          g.shares += h.shares; g.foreign += h.foreign; g.eur += h.totalEUR;
          if (h.firstDate < g.first) g.first = h.firstDate;
          g.tickers.push(h.ticker);
        });
        const holdRows = Object.values(groups).map(g => ({ ...g, foreign: r2(g.foreign), local: r2(conv(g.eur)) }));

        summary[y] = { tx, c3, c4, c5, c6, row5, row6, row7, dealsTax, divRows, divTax, holdRows,
          hasDeals: Object.keys(yd.taxable).length > 0, partial: lastDay < `${y}-12-31` };
      });
      window.taxSummary = summary; // handy for checking numbers in the console

      summaryCards.innerHTML = yearList.map(y => {
        const s = summary[y];
        const a = v => amount(v, y);
        return `
        <div class="card">
          <div class="card-label">Данък за ${y}${s.partial ? ` (до ${fmtDate(lastDay)})` : ''}</div>
          <div class="card-value ${s.dealsTax + s.divTax > 0 ? 'neg' : 'zero-val'}">${a(s.dealsTax + s.divTax)}</div>
          <div class="card-sub">Сделки 10% от ред 7: ${a(s.dealsTax)} · Дивиденти 5%: ${a(s.divTax)}</div>
        </div>`;
      }).join('');

      const dealsTable = (bucket, y) => {
        const tot = sumDeals(bucket);
        const m = v => money(v, y), cur = currencyOf(y);
        return `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="left">#</th>
                    <th class="left">Код (Тикер)</th>
                    <th>Сделки</th>
                    <th>Продажна цена ${cur}</th>
                    <th>Цена на придобиване ${cur}</th>
                    <th>Печалба ${cur}</th>
                    <th>Загуба ${cur}</th>
                  </tr>
                </thead>
                <tbody>
                  ${Object.entries(bucket).map(([tick, t], i) => `<tr>
                      <td class="left">${i + 1}</td>
                      <td class="ticker">${tick}<br><span style="color:var(--text3);font-size:0.6875rem;font-weight:400">${names[tick] || ''}</span></td>
                      <td>${t.deals}</td>
                      <td>${m(t.sellEUR)}</td>
                      <td>${m(t.buyEUR)}</td>
                      <td class="${t.profit > 0 ? 'profit-val' : 'zero-val'}">${t.profit > 0 ? m(t.profit) : '—'}</td>
                      <td class="${t.loss > 0 ? 'loss-val' : 'zero-val'}">${t.loss > 0 ? m(t.loss) : '—'}</td>
                    </tr>`).join('')}
                  <tr class="total-row">
                    <td colspan="3" class="left">Общо</td>
                    <td><strong>${m(tot.sell)}</strong></td>
                    <td><strong>${m(tot.buy)}</strong></td>
                    <td class="profit-val"><strong>${m(tot.profit)}</strong></td>
                    <td class="loss-val"><strong>${m(tot.loss)}</strong></td>
                  </tr>
                </tbody>
              </table>
            </div>`;
      };

      let html = `<div class="warn">ℹ️ Курсовете са на Trading 212 — НАП изисква курса на БНБ към датата на сделката, разликите обикновено са минимални.</div>`;
      if (missingHistory.size) {
        html += `<div class="warn">⚠️ Липсват покупки за: ${[...missingHistory].join(", ")} — качете и по-старите CSV файлове. За тези продажби е използван Result от Trading 212.</div>`;
      }
      if (missingRates.size) {
        html += `<div class="warn">⚠️ Няма курс в CSV за: ${[...missingRates].join(', ')} — използван е приблизителен курс.</div>`;
      }

      yearList.forEach(y => {
        const s = summary[y];
        const yd = years[y];
        const m = v => money(v, y), cur = currencyOf(y);
        const asOf = s.partial ? fmtDate(lastDay) : `31.12.${y}`;
        html += `<div class="year-block"><div class="year-header">${y}${s.partial ? ' — непълна година' : ''}</div>`;
        html += napBlock(y, s, asOf, fmtDate);

        // Приложение 5, Таблица 2 — облагаеми
        html += `
          <div class="section">
            <div class="section-title">Разбивка по тикери — продажби <span class="section-badge">детайли</span></div>
            ${Object.keys(yd.taxable).length ? dealsTable(yd.taxable, y) : '<p class="empty-text">Няма облагаеми продажби.</p>'}
          </div>`;

        // Дивиденти
        if (yd.dividends.length) {
          html += `
          <div class="section">
            <div class="section-title">Разбивка — дивиденти <span class="section-badge">детайли</span></div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="left">Дата</th>
                    <th class="left">Тикер</th>
                    <th class="left">Държава</th>
                    <th>Брутен дивидент ${cur}</th>
                    <th>Удържан данък ${cur}</th>
                    <th>Дължим данък ${cur}</th>
                  </tr>
                </thead>
                <tbody>
                  ${yd.dividends.map(d => `<tr>
                      <td class="left">${fmtDate(d.day)}</td>
                      <td class="ticker">${d.ticker}</td>
                      <td class="left">${country(d.isin)}</td>
                      <td>${m(d.grossEUR)}</td>
                      <td>${m(d.whtEUR)}</td>
                      <td>${m(Math.max(d.grossEUR * 0.05 - d.whtEUR, 0))}</td>
                    </tr>`).join('')}
                  <tr class="total-row">
                    <td colspan="5" class="left">Общо данък 5%</td>
                    <td><strong>${amount(s.divTax, y)}</strong></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>`;
        }

        // Приложение 8, Част I — притежавани акции
        const holdings = yd.holdings;
        html += `
          <div class="section">
            <div class="section-title">Разбивка — акции към ${asOf} <span class="section-badge">детайли</span></div>
            ${holdings.length === 0 ? '<p class="empty-text">Няма налични позиции в края на годината.</p>' : `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th class="left">#</th>
                    <th class="left">Емитент / Тикер</th>
                    <th class="left">Държава</th>
                    <th>Брой акции</th>
                    <th>Дата на придобиване</th>
                    <th>Обща цена ${cur}</th>
                  </tr>
                </thead>
                <tbody>
                  ${holdings.map((h, i) => `<tr>
                      <td class="left">${i + 1}</td>
                      <td class="ticker">${h.ticker}<br><span style="color:var(--text3);font-size:0.6875rem;font-weight:400">${h.name}</span></td>
                      <td class="left">${country(h.isin)}</td>
                      <td>${h.shares.toFixed(8)}</td>
                      <td>${fmtDate(h.firstDate)}</td>
                      <td>${m(h.totalEUR)}</td>
                    </tr>`).join('')}
                  <tr class="total-row">
                    <td colspan="5" class="left">Общо</td>
                    <td>${m(holdings.reduce((t, h) => t + h.totalEUR, 0))}</td>
                  </tr>
                </tbody>
              </table>
            </div>`}
          </div>`;

        html += '</div>'; // year-block
      });

      taxOutput.innerHTML = html;
      results.style.display = 'block';
      setupCsvTable(header, data.map(o => header.map(h => o[h] ?? '')));
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function eur(v) {
      return (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2) + ' €';
    }

    // Returns for 2024 and 2025 are in BGN; from 2026 (euro adoption) in EUR.
    // Amounts are computed in EUR and converted back at the fixed rate.
    const currencyOf = y => y <= 2025 ? 'BGN' : 'EUR';
    function money(vEUR, y) {
      if (currencyOf(y) === 'EUR') return eur(vEUR);
      const v = vEUR * EURO_TO_BGN;
      return (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2) + ' лв.';
    }
    // Formats an amount that is already in the return's currency
    function amount(v, y) {
      return (v >= 0 ? '' : '−') + Math.abs(v).toFixed(2) + (currencyOf(y) === 'EUR' ? ' €' : ' лв.');
    }

    const COUNTRIES = {
      US: 'САЩ', IE: 'Ирландия', FR: 'Франция', NL: 'Нидерландия', DE: 'Германия', GB: 'Обединено кралство',
      JE: 'Джърси', LU: 'Люксембург', CA: 'Канада', KY: 'Каймански острови', IL: 'Израел', CH: 'Швейцария',
      TW: 'Тайван', KR: 'Южна Корея', FI: 'Финландия', SE: 'Швеция', DK: 'Дания', NO: 'Норвегия', IT: 'Италия',
      ES: 'Испания', BE: 'Белгия', AT: 'Австрия', PT: 'Португалия', AU: 'Австралия', JP: 'Япония', CN: 'Китай',
      HK: 'Хонконг', BM: 'Бермуди', SG: 'Сингапур', BR: 'Бразилия', IN: 'Индия', MX: 'Мексико', PL: 'Полша'
    };
    const countryName = isin => COUNTRIES[(isin || '').slice(0, 2)] || (isin || '').slice(0, 2) || '—';

    // A value the user types into the NAP portal; click copies it
    const napVal = v => `<span class="nap-val" data-v="${v}" title="Копирай">${v}</span>`;
    const fmtNum = v => v.toFixed(2);

    // "What to type into the NAP portal" — mirrors the layout of the portal's own tables
    function napBlock(y, s, asOf, fmtDate) {
      const cur = currencyOf(y);
      const curWord = cur === 'BGN' ? 'лева' : 'евро';
      const n = v => napVal(fmtNum(v));
      let out = `
        <div class="nap">
          <div class="nap-head">
            Какво да попълните в декларацията за ${y} — всички суми са в <strong>${curWord}</strong>
            ${s.partial ? `<span class="nap-partial">годината не е приключила — данни до ${asOf}</span>` : ''}
          </div>
          <div class="nap-hint">Кликнете върху стойност, за да я копирате.</div>

          <div class="nap-title">Приложение № 5 — Таблица 2</div>
          ${!s.hasDeals ? '<p class="empty-text">Няма продажби — Приложение 5 не е нужно за тази година.</p>' : `
          <div class="table-wrap">
            <table class="nap-table">
              <thead>
                <tr><th>№</th><th>Код</th><th>Общ размер на продажните цени</th><th>Общ размер на цените на придобиване</th><th>Реализирани печалби</th><th>Реализирани загуби</th></tr>
                <tr class="nap-colnum"><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
              </thead>
              <tbody>
                <tr><td class="c">1.1</td><td class="c">${napVal('508')}</td><td>${n(s.c3)}</td><td>${n(s.c4)}</td><td>${n(s.c5)}</td><td>${n(s.c6)}</td></tr>
                <tr class="nap-calc"><td class="c">4</td><td colspan="3" class="left">Обща сума за годината</td><td>${fmtNum(s.c5)}</td><td>${fmtNum(s.c6)}</td></tr>
                <tr class="nap-calc"><td class="c">5</td><td colspan="3" class="left">Разлика между к. 5 и к. 6 (ако е отрицателна — нула)</td><td colspan="2">${fmtNum(s.row5)}</td></tr>
                <tr class="nap-calc"><td class="c">6</td><td colspan="3" class="left">Разходи за дейността (10% от ред 5)</td><td colspan="2">${fmtNum(s.row6)}</td></tr>
                <tr class="nap-calc"><td class="c">7</td><td colspan="3" class="left"><strong>Облагаем доход по Таблица 2</strong> (ред 5 − ред 6)</td><td colspan="2"><strong>${fmtNum(s.row7)}</strong></td></tr>
              </tbody>
            </table>
          </div>
          <div class="nap-note">Попълвате само ред 1.1. Редове 4–7 порталът изчислява сам — проверете, че съвпадат.</div>

          <div class="nap-title">Приложение № 5 — Част II</div>
          <div class="table-wrap">
            <table class="nap-table">
              <tbody>
                <tr class="nap-calc"><td class="c">1</td><td class="left">Облагаем доход (ред 7 на Таблица 2)</td><td>${fmtNum(s.row7)}</td></tr>
                <tr><td class="c">2</td><td class="left">Осигурителни вноски по чл. 40, ал. 5 от ЗЗО, внесени авансово</td><td>${n(0)}</td></tr>
                <tr><td class="c">3</td><td class="left">Окончателни осигурителни вноски по чл. 40, ал. 5 от ЗЗО</td><td>${n(0)}</td></tr>
                <tr class="nap-calc"><td class="c">4</td><td class="left"><strong>Годишна данъчна основа</strong> (ред 1 − ред 2 − ред 3)</td><td><strong>${fmtNum(s.row7)}</strong></td></tr>
              </tbody>
            </table>
          </div>
          <div class="nap-note">
            В Част IV на декларацията ред 4001 става годишната основа от Приложение 1 + <strong>${fmtNum(s.row7)}</strong>.
            Данъкът от сделките е 10% от ред 7 ≈ <strong>${amount(s.dealsTax, y)}</strong>.
          </div>`}`;

      if (!s.holdRows.length && !s.divRows.length) {
        out += `
          <div class="nap-title">Приложение № 8</div>
          <p class="empty-text">Не е нужно — към ${asOf} няма притежавани акции и няма получени дивиденти.</p>`;
      }

      if (s.holdRows.length) {
        out += `
          <div class="nap-title">Приложение № 8 — Част I (акции към ${asOf})</div>
          <div class="table-wrap">
            <table class="nap-table">
              <thead>
                <tr><th rowspan="2">Вид</th><th rowspan="2">Държава</th><th rowspan="2">Брой</th><th rowspan="2">Дата на придобиване</th><th colspan="2">Обща цена на придобиване</th></tr>
                <tr><th>В съответната валута</th><th>В ${curWord}</th></tr>
                <tr class="nap-colnum"><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
              </thead>
              <tbody>
                ${s.holdRows.map(g => `<tr>
                  <td class="c">Акции</td>
                  <td class="left">${napVal(g.country)}<div class="nap-sub">${g.tickers.join(', ')}</div></td>
                  <td>${napVal(g.shares.toFixed(8).replace(/0+$/, '').replace(/\.$/, ''))}</td>
                  <td class="c">${napVal(fmtDate(g.first))}</td>
                  <td>${n(g.foreign)} <span class="nap-sub">${g.fcur}</span></td>
                  <td>${n(g.local)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="nap-note">Датата е първата покупка на позицията, която все още държите.</div>`;
      }

      if (s.divRows.length) {
        out += `
          <div class="nap-title">Приложение № 8 — Част III (дивиденти)</div>
          <div class="table-wrap">
            <table class="nap-table">
              <thead>
                <tr><th>№</th><th>Наименование на платеца</th><th>Държава</th><th>Код вид доход</th><th>Код за метод</th><th>Брутен размер</th><th>Платен данък в чужбина</th><th>Допустим данъчен кредит</th><th>Признат данъчен кредит</th><th>Дължим данък</th></tr>
                <tr class="nap-colnum"><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>9</th><th>10</th><th>11</th><th>12</th></tr>
              </thead>
              <tbody>
                ${s.divRows.map((d, i) => `<tr>
                  <td class="c">1.${i + 1}</td>
                  <td class="left">${napVal(d.name)}</td>
                  <td class="left">${napVal(countryName(d.isin))}</td>
                  <td class="c">${napVal('8141')}</td>
                  <td class="c">${napVal('1')}</td>
                  <td>${n(d.gross)}</td>
                  <td>${n(d.wht)}</td>
                  <td class="nap-calc-cell">${fmtNum(d.allowed)}</td>
                  <td class="nap-calc-cell">${fmtNum(d.allowed)}</td>
                  <td class="nap-calc-cell">${fmtNum(d.due)}</td>
                </tr>`).join('')}
                <tr class="nap-calc"><td colspan="9" class="left">Обща сума на окончателния данък за дивиденти</td><td><strong>${fmtNum(s.divTax)}</strong></td></tr>
              </tbody>
            </table>
          </div>
          <div class="nap-note">Колони 7 и 8 остават празни. Колони 10–12 порталът изчислява сам.</div>`;
      }

      return out + '</div>';
    }

    // Click-to-copy for NAP values
    document.addEventListener('click', e => {
      const el = e.target.closest('.nap-val');
      if (!el) return;
      try { navigator.clipboard.writeText(el.dataset.v); } catch (_) {}
      el.classList.add('copied');
      setTimeout(() => el.classList.remove('copied'), 900);
    });

    // ── CSV Table ──────────────────────────────────────────────────────────
    let csvHeader = [], csvData = [], lastFiltered = [];
    let sortCol = -1, sortDir = 'asc';

    function setupCsvTable(header, data) {
      csvHeader = header;
      csvData = data.filter(r => r.some(c => c.trim() !== ''));
      renderCsvTable();
    }

    function renderCsvTable() {
      const search     = (document.getElementById('csvSearch')?.value || '').toLowerCase();
      const actFilter  = document.getElementById('actionFilter')?.value || '';
      const actionIdx  = csvHeader.indexOf('Action');
      let filtered = csvData.filter(row => {
        const action = row[actionIdx];
        if (!BUY_ACTIONS.has(action) && !SELL_ACTIONS.has(action)) return false;
        if (actFilter && action !== actFilter) return false;
        if (search) return row.some(c => c.toLowerCase().includes(search));
        return true;
      });
      if (sortCol >= 0) {
        filtered.sort((a, b) => {
          let va = a[sortCol] || '', vb = b[sortCol] || '';
          const dr = /^\d{4}-\d{2}-\d{2}/;
          if (dr.test(va) && dr.test(vb)) {
            const da = new Date(va.replace(' ', 'T')), db = new Date(vb.replace(' ', 'T'));
            if (!isNaN(da)) return sortDir === 'asc' ? da - db : db - da;
          }
          const na = parseFloat(va), nb = parseFloat(vb);
          if (!isNaN(na) && !isNaN(nb)) return sortDir === 'asc' ? na - nb : nb - na;
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });
      }
      lastFiltered = filtered;

      const thead = document.querySelector('#csvTable thead');
      const tbody = document.querySelector('#csvTable tbody');
      thead.innerHTML = '<tr>' + csvHeader.map((h, i) =>
        `<th class="${i <= 4 ? 'left' : ''}" onclick="sortBy(${i})">${h} ${sortCol === i ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>`
      ).join('') + '</tr>';
      tbody.innerHTML = filtered.map(row =>
        `<tr class="${SELL_ACTIONS.has(row[actionIdx]) ? 'highlight' : ''}">` +
        row.map((c, i) => `<td class="${i <= 4 ? 'left' : ''}">${c}</td>`).join('') + '</tr>'
      ).join('');
      document.getElementById('rowCount').textContent =
        `Показани: ${filtered.length} от ${csvData.length}`;
    }

    function sortBy(col) {
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = 'asc'; }
      renderCsvTable();
    }

    document.getElementById('exportCsvBtn').onclick = () => {
      if (!lastFiltered.length) { alert('Няма данни'); return; }
      const esc = s => { const str = String(s || ''); return str.includes(',') || str.includes('"') ? '"' + str.replace(/"/g, '""') + '"' : str; };
      const csv = [csvHeader, ...lastFiltered].map(r => r.map(esc).join(',')).join('\n');
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })),
        download: `export_${new Date().toISOString().slice(0,10)}.csv`
      });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };

    // ── Tab switching ──────────────────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach((b, i) =>
        b.classList.toggle('active', ['tax','raw'][i] === name));
      document.querySelectorAll('.tab-panel').forEach(p =>
        p.classList.toggle('active', p.id === 'tab-' + name));
    }

    // ── CSV Parser ─────────────────────────────────────────────────────────
    function parseCSV(text) {
      const rows = []; let cur = [], val = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i+1];
        if (c === '"' && inQ && n === '"') { val += '"'; i++; }
        else if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cur.push(val); val = ''; }
        else if (c === '\n' && !inQ) { cur.push(val); rows.push(cur); cur = []; val = ''; }
        else { val += c; }
      }
      cur.push(val); rows.push(cur);
      return rows;
    }
    </script>
  </body>
