<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PersonalBuddy – Sign In</title>
    <meta
      name="description"
      content="PersonalBuddy – one place to access all your Buddy apps: DietBuddy and GymBuddy."
    />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* ── DESIGN TOKENS ───────────────────────────────────────── */
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #252833;
        --surface3: #2f3342;
        --border: #353849;
        --text: #e8eaf0;
        --text2: #9ca3b8;
        --text3: #6b7280;
        --accent: #22c55e;
        --accent-h: #16a34a;
        --accent-bg: rgba(34, 197, 94, 0.1);
        --danger: #ef4444;
        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        --trans: all 0.2s ease;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 14px;
      }
      body {
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }
      input,
      button {
        font-family: inherit;
      }
      input {
        font-size: 0.875rem;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        outline: none;
        transition: var(--trans);
        width: 100%;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      /* ── BUTTONS ─────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        transition: var(--trans);
        font-size: 0.8125rem;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-h);
      }
      .btn-ghost {
        color: var(--text2);
        padding: 6px 10px;
      }
      .btn-ghost:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .btn-icon {
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        color: var(--text2);
        transition: var(--trans);
      }
      .btn-icon:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── AUTH CARD ───────────────────────────────────────────── */
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 20px;
        width: 100%;
        max-width: 560px;
        box-shadow: var(--shadow);
        animation: fadeIn 0.3s;
      }
      @media (min-width: 920px) {
        .auth-card {
          padding: 40px 40px;
        }
      }
      @media (min-width: 640px) {
        .auth-card {
          padding: 50px 52px;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .auth-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 28px;
      }
      .auth-logo svg {
        width: 32px;
        height: 32px;
        color: var(--accent);
      }
      .auth-logo span {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
      }
      .form-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-size: 0.8rem;
        margin-bottom: 16px;
      }

      /* ── APP SHELL ───────────────────────────────────────────── */
      #topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow: hidden;
      }
      @media (min-width: 920px) {
        #topbar {
          gap: 12px;
          padding: 10px 20px;
        }
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }
      .logo svg {
        width: 24px;
        height: 24px;
      }
      .topbar-user {
        font-size: 0.8rem;
        color: var(--text3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        max-width: 120px;
      }
      @media (min-width: 920px) {
        .topbar-user {
          max-width: 200px;
        }
      }

      /* ── APP CARDS ───────────────────────────────────────────── */
      .app-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 24px 16px;
        max-width: 960px;
        margin: 0 auto;
      }
      @media (max-width: 920px) {
        .app-grid {
          grid-template-columns: 1fr;
        }
      }
      .app-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transition: var(--trans);
        text-decoration: none;
        color: inherit;
        cursor: pointer;
      }
      .app-card:hover {
        border-color: var(--accent);
        background: var(--surface2);
        box-shadow:
          0 0 0 1px var(--accent),
          var(--shadow);
        transform: translateY(-2px);
        text-decoration: none;
      }
      .app-card-icon {
        width: 52px;
        height: 52px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .app-card-icon svg {
        width: 26px;
        height: 26px;
      }
      .app-card-title {
        font-size: 1rem;
        font-weight: 700;
      }
      .app-card-desc {
        font-size: 0.82rem;
        color: var(--text3);
        line-height: 1.5;
      }
      .app-card-link {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: auto;
      }

      /* ── TOASTS ──────────────────────────────────────────────── */
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        font-weight: 500;
        box-shadow: var(--shadow);
        animation: slideIn 0.25s ease;
      }
      .toast-success {
        background: var(--surface);
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .toast-error {
        background: var(--surface);
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* mobile-first app grid */
      @media (max-width: 920) {
        .app-grid {
          padding: 16px 12px;
          gap: 14px;
          grid-template-columns: 1fr;
        }
        .app-card {
          padding: 20px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div x-data x-init="$store.pb.init()">
      <!-- ══ LOADING ══════════════════════════════════════════════ -->
      <template x-if="$store.pb.authState === 'loading'">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
          "
        >
          <div style="text-align: center; color: var(--text3)">
            <svg
              style="
                width: 40px;
                height: 40px;
                color: var(--accent);
                animation: pulse 1.5s infinite;
                margin-bottom: 12px;
              "
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
            <p style="font-size: 0.9rem">Loading…</p>
          </div>
        </div>
      </template>

      <!-- ══ AUTH PAGE ════════════════════════════════════════════ -->
      <template x-if="$store.pb.authState === 'unauthenticated'">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
          "
        >
          <div style="width: 100%; max-width: 560px">
            <div class="auth-card">
              <!-- Logo -->
              <div class="auth-logo">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                </svg>
                <span>PersonalBuddy</span>
              </div>

              <!-- Lang toggle -->
              <div
                style="
                  display: flex;
                  justify-content: flex-end;
                  margin-bottom: 12px;
                "
              >
                <button
                  class="btn btn-ghost btn-sm"
                  style="
                    font-size: 0.75rem;
                    font-weight: 700;
                    padding: 4px 10px;
                    letter-spacing: 0.5px;
                  "
                  @click="$store.pb.setLang($store.pb.lang === 'en' ? 'bg' : 'en')"
                  x-text="$store.pb.lang === 'en' ? 'EN' : 'BG'"
                ></button>
              </div>

              <!-- Error -->
              <div
                x-show="$store.pb.error"
                class="error-box"
                x-text="$store.pb.error"
              ></div>

              <!-- Form -->
              <h2
                style="font-size: 1.1rem; font-weight: 700; margin-bottom: 4px"
                x-text="$store.pb.t('welcome_back')"
              ></h2>
              <p
                style="
                  color: var(--text3);
                  font-size: 0.85rem;
                  margin-bottom: 20px;
                "
                x-text="$store.pb.t('sign_in_desc')"
              ></p>
              <div class="form-group">
                <label
                  class="form-label"
                  x-text="$store.pb.t('label_email')"
                ></label>
                <input
                  type="email"
                  x-model="$store.pb.email"
                  @keyup.enter="$store.pb.login()"
                  :placeholder="$store.pb.t('placeholder_email')"
                />
              </div>
              <div class="form-group">
                <label
                  class="form-label"
                  x-text="$store.pb.t('label_password')"
                ></label>
                <input
                  type="password"
                  x-model="$store.pb.password"
                  @keyup.enter="$store.pb.login()"
                  :placeholder="$store.pb.t('placeholder_password')"
                />
              </div>
              <button
                class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 10px 16px"
                @click="$store.pb.login()"
                :disabled="$store.pb.loading"
              >
                <span
                  x-show="!$store.pb.loading"
                  x-text="$store.pb.t('btn_sign_in')"
                ></span>
                <span
                  x-show="$store.pb.loading"
                  x-text="$store.pb.t('btn_signing_in')"
                ></span>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ══ APP SHELL ════════════════════════════════════════════ -->
      <template x-if="$store.pb.authState === 'authenticated'">
        <div style="display: flex; flex-direction: column; min-height: 100vh">
          <!-- Top Bar -->
          <header id="topbar">
            <div class="logo">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              </svg>
              PersonalBuddy
            </div>
            <div style="flex: 1"></div>
            <button
              class="btn btn-ghost btn-sm"
              style="
                font-size: 0.75rem;
                font-weight: 700;
                padding: 4px 10px;
                letter-spacing: 0.5px;
              "
              @click="$store.pb.setLang($store.pb.lang === 'en' ? 'bg' : 'en')"
              x-text="$store.pb.lang === 'en' ? 'EN' : 'BG'"
            ></button>
            <span
              class="topbar-user"
              x-text="$store.pb.user?.displayName || $store.pb.user?.email?.split('@')[0]"
            ></span>
            <button
              class="btn-icon"
              @click="$store.pb.logout()"
              :title="$store.pb.t('sign_out')"
            >
              <svg
                style="width: 16px; height: 16px"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </header>

          <!-- Page heading -->
          <div style="padding: 28px 16px 8px; text-align: center">
            <h1
              style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px"
              x-text="$store.pb.t('dashboard_title')"
            ></h1>
            <p
              style="color: var(--text3); font-size: 0.875rem"
              x-text="$store.pb.t('dashboard_desc')"
            ></p>
          </div>

          <!-- App Cards -->
          <div class="app-grid">
            <!-- BudgetBuddy — Budget -->
            <a
              class="app-card"
              href="https://splochev.github.io/budgetBuddy/budget.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(234, 179, 8, 0.12)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#facc15"
                  stroke-width="2"
                >
                  <rect x="2" y="6" width="20" height="14" rx="2"></rect>
                  <path d="M2 10h20"></path>
                  <circle cx="16" cy="16" r="1.5" fill="#facc15" stroke="none"></circle>
                </svg>
              </div>
              <div>
                <div
                  class="app-card-title"
                  x-text="$store.pb.t('app_budget_title')"
                ></div>
                <div
                  class="app-card-desc"
                  x-text="$store.pb.t('app_budget_desc')"
                ></div>
              </div>
              <div class="app-card-link" style="color: #facc15">
                <span x-text="$store.pb.t('app_budget_link')"></span>
                <svg
                  style="width: 12px; height: 12px"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </div>
            </a>

            <!-- DietBuddy — Meal Planner -->
            <a
              class="app-card"
              href="https://splochev.github.io/DietBudy/planner.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(34, 197, 94, 0.12)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--accent)"
                  stroke-width="2"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                  <line x1="8" y1="14" x2="16" y2="14" />
                </svg>
              </div>
              <div>
                <div
                  class="app-card-title"
                  x-text="$store.pb.t('app_planner_title')"
                ></div>
                <div
                  class="app-card-desc"
                  x-text="$store.pb.t('app_planner_desc')"
                ></div>
              </div>
              <div class="app-card-link">
                <span x-text="$store.pb.t('app_planner_link')"></span>
                <svg
                  style="width: 12px; height: 12px"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </div>
            </a>

            <!-- GymBuddy — Workouts -->
            <a
              class="app-card"
              href="https://splochev.github.io/GymBudy/workout.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(99, 102, 241, 0.12)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#818cf8"
                  stroke-width="2"
                >
                  <rect x="2" y="9" width="3" height="6" rx="1" />
                  <rect x="19" y="9" width="3" height="6" rx="1" />
                  <rect x="5" y="7" width="3" height="10" rx="1" />
                  <rect x="16" y="7" width="3" height="10" rx="1" />
                  <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
              </div>
              <div>
                <div
                  class="app-card-title"
                  x-text="$store.pb.t('app_gym_title')"
                ></div>
                <div
                  class="app-card-desc"
                  x-text="$store.pb.t('app_gym_desc')"
                ></div>
              </div>
              <div class="app-card-link" style="color: #818cf8">
                <span x-text="$store.pb.t('app_gym_link')"></span>
                <svg
                  style="width: 12px; height: 12px"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </div>
            </a>

            <!-- DietBuddy — Food Database -->
            <a
              class="app-card"
              href="https://splochev.github.io/DietBudy/food-manager.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(34, 197, 94, 0.12)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--accent)"
                  stroke-width="2"
                >
                  <line x1="6" y1="2" x2="6" y2="9" />
                  <line x1="9" y1="2" x2="9" y2="9" />
                  <path d="M6 9 Q7.5 12 9 9" />
                  <line x1="7.5" y1="12" x2="7.5" y2="22" />
                  <ellipse cx="16.5" cy="6" rx="2.5" ry="4" />
                  <line x1="16.5" y1="10" x2="16.5" y2="22" />
                </svg>
              </div>
              <div>
                <div
                  class="app-card-title"
                  x-text="$store.pb.t('app_food_title')"
                ></div>
                <div
                  class="app-card-desc"
                  x-text="$store.pb.t('app_food_desc')"
                ></div>
              </div>
              <div class="app-card-link">
                <span x-text="$store.pb.t('app_food_link')"></span>
                <svg
                  style="width: 12px; height: 12px"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </div>
            </a>

            <!-- DietBuddy — Weight Tracker -->
            <a
              class="app-card"
              href="https://splochev.github.io/DietBudy/weight-tracker.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(20, 184, 166, 0.12)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#14b8a6"
                  stroke-width="2"
                >
                  <polyline points="3 19 8 13 13 15 19 7"/>
                  <line x1="3" y1="22" x2="21" y2="22"/>
                </svg>
              </div>
              <div>
                <div
                  class="app-card-title"
                  x-text="$store.pb.t('app_weight_title')"
                ></div>
                <div
                  class="app-card-desc"
                  x-text="$store.pb.t('app_weight_desc')"
                ></div>
              </div>
              <div class="app-card-link" style="color: #14b8a6">
                <span x-text="$store.pb.t('app_weight_link')"></span>
                <svg
                  style="width: 12px; height: 12px"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17L17 7M17 7H7M17 7v10" />
                </svg>
              </div>
            </a>

            <!-- CatanBuddy — Board Generator -->
            <a
              class="app-card"
              href="./catan.html"
              rel="noopener"
            >
              <div
                class="app-card-icon"
                style="background: rgba(249, 115, 22, 0.12)"
              >
                <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs><clipPath id="hexci"><polygon points="13,1 24,7 24,19 13,25 2,19 2,7"/></clipPath></defs>
                  <g clip-path="url(#hexci)">

      Alpine.store("pb", {
        authState: "loading", // loading | unauthenticated | authenticated
        user: null,
        email: "",
        password: "",
        loading: false,
        error: "",
        toasts: [],
        lang: localStorage.getItem("personalbuddy-lang") || "en",

        t(key) {
          const tr = translations[this.lang] ?? translations.en;
          return tr[key] ?? translations.en[key] ?? key;
        },

        setLang(code) {
          this.lang = code;
          localStorage.setItem("personalbuddy-lang", code);
        },

        init() {
          onAuthStateChanged(auth, (user) => {
            if (user) {
              this.user = user;
              this.authState = "authenticated";
              document.title = "PersonalBuddy \u2013 Your Hub";
            } else {
              this.user = null;
              this.authState = "unauthenticated";
              document.title = "PersonalBuddy \u2013 Sign In";
            }
          });
        },

        async login() {
          this.error = "";
          if (!this.email || !this.password) {
            this.error = this.t("error_fill_fields");
            return;
          }
          this.loading = true;
          try {
            await signInWithEmailAndPassword(auth, this.email, this.password);
            this.password = "";
          } catch (e) {
            this.error = this._friendly(e.code);
          } finally {
            this.loading = false;
          }
        },

        async logout() {
          await signOut(auth);
        },

        toast(msg, type = "success") {
          const id = Math.random().toString(36).slice(2);
          this.toasts = [...this.toasts, { id, msg, type }];
          setTimeout(() => {
            this.toasts = this.toasts.filter((t) => t.id !== id);
          }, 3000);
        },

        _friendly(code) {
          const map = {
            "auth/user-not-found": this.t("error_user_not_found"),
            "auth/wrong-password": this.t("error_wrong_password"),
            "auth/invalid-credential": this.t("error_invalid_credential"),
            "auth/too-many-requests": this.t("error_too_many_requests"),
            "auth/network-request-failed": this.t("error_network"),
          };
          return map[code] ?? this.t("error_generic");
        },
      });
