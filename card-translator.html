<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Translator</title>
    <link rel="icon" type="image/png" href="card-translator.png" />
    <style>
      /* ── DESIGN TOKENS ───────────────────────────────────────── */
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --surface2: #252833;
        --surface3: #2f3342;
        --border: #353849;
        --text: #e8eaf0;
        --text2: #9ca3b8;
        --text3: #6b7280;
        --accent: #22c55e;
        --accent-h: #16a34a;
        --accent-bg: rgba(34, 197, 94, 0.1);
        --danger: #ef4444;
        --radius: 10px;
        --radius-sm: 6px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        --trans: all 0.2s ease;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 14px;
      }
      body {
        font-family: "Segoe UI", "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
      }
      input,
      button {
        font-family: inherit;
      }
      input {
        font-size: 0.875rem;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        outline: none;
        transition: var(--trans);
        width: 100%;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      /* ── BUTTONS ─────────────────────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        transition: var(--trans);
        font-size: 0.8125rem;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-h);
      }
      .btn-ghost {
        color: var(--text2);
        padding: 6px 10px;
      }
      .btn-ghost:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .btn-icon {
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        color: var(--text2);
        transition: var(--trans);
      }
      .btn-icon:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── AUTH CARD ───────────────────────────────────────────── */
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 20px;
        width: 100%;
        max-width: 560px;
        box-shadow: var(--shadow);
        animation: fadeIn 0.3s;
      }
      @media (min-width: 920) {
        .auth-card {
          padding: 40px 40px;
        }
      }
      @media (min-width: 640px) {
        .auth-card {
          padding: 50px 52px;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .auth-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 28px;
      }
      .auth-logo svg {
        width: 32px;
        height: 32px;
        color: var(--accent);
      }
      .auth-logo span {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
      }
      .form-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-size: 0.8rem;
        margin-bottom: 16px;
      }

      /* ── APP SHELL ───────────────────────────────────────────── */
      #topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow: hidden;
      }
      @media (min-width: 920) {
        #topbar {
          gap: 12px;
          padding: 10px 20px;
        }
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: -0.5px;
        flex-shrink: 0;
      }
      .logo svg {
        width: 24px;
        height: 24px;
      }
      .topbar-user {
        font-size: 0.8rem;
        color: var(--text3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        max-width: 120px;
      }
      @media (min-width: 920) {
        .topbar-user {
          max-width: 200px;
        }
      }

      /* ── APP CARDS ───────────────────────────────────────────── */
      .app-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 24px 16px;
        max-width: 960px;
        margin: 0 auto;
      }
      @media (max-width: 920px) {
        .app-grid {
          grid-template-columns: 1fr;
        }
      }
      .app-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transition: var(--trans);
        text-decoration: none;
        color: inherit;
        cursor: pointer;
      }
      .app-card:hover {
        border-color: var(--accent);
        background: var(--surface2);
        box-shadow:
          0 0 0 1px var(--accent),
          var(--shadow);
        transform: translateY(-2px);
        text-decoration: none;
      }
      .app-card-icon {
        width: 52px;
        height: 52px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .app-card-icon svg {
        width: 26px;
        height: 26px;
      }
      .app-card-title {
        font-size: 1rem;
        font-weight: 700;
      }
      .app-card-desc {
        font-size: 0.82rem;
        color: var(--text3);
        line-height: 1.5;
      }
      .app-card-link {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: auto;
      }

      /* ── TOASTS ──────────────────────────────────────────────── */
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        font-weight: 500;
        box-shadow: var(--shadow);
        animation: slideIn 0.25s ease;
      }
      .toast-success {
        background: var(--surface);
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .toast-error {
        background: var(--surface);
        border: 1px solid var(--danger);
        color: var(--danger);
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* mobile-first app grid */
      @media (max-width: 920) {
        .app-grid {
          padding: 16px 12px;
          gap: 14px;
          grid-template-columns: 1fr;
        }
        .app-card {
          padding: 20px 16px;
        }
      }

      main {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px 64px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .controls > * {
        flex: 1 1 auto;
      }

      button {
        font-size: 14px;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-h);
      }

      .preview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }

      @media print {
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        body {
          background: #fff !important;
        }

        header,
        .controls,
        .item textarea,
        .item .remove {
          display: none !important;
        }

        main {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .preview {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
        }

        .item {
          break-inside: avoid;
          box-shadow: none;
          padding: 6px;
        }

        .item img {
          max-height: 380px;
        }

        .overlay {
          display: block !important;
        }
      }

      .item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        overflow: visible;
      }

      .imageWrapper {
        position: relative;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--surface2);
      }

      .item img {
        max-width: 100%;
        max-height: 380px;
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
      }

      .overlay {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 10px 12px 10px;
        color: var(--text);
        font-size: 14px;
        line-height: 1.25;
        white-space: pre-wrap;
        background: rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      .item textarea {
        width: 100%;
        min-height: 80px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        padding: 10px;
        font-size: 14px;
        resize: vertical;
        line-height: 1.25;
        box-sizing: border-box;
        overflow: auto;
        max-height: 180px;
        background: var(--surface2);
        color: var(--text);
      }

      .readonly-mode .item textarea {
        display: none !important;
      }

      .readonly-mode .overlay {
        display: block;
      }

      .readonly-mode .remove {
        display: none;
      }

      .item .remove {
        align-self: flex-end;
        background: var(--danger);
        padding: 6px 12px;
        font-size: 14px;
        border-radius: var(--radius-sm);
      }

      .item .remove:hover {
        background: #c53030;
      }

      #chooseFiles,
      #toggleMode,
      #print {
        width: 150px;
        max-width: 150px;
        flex: 0 0 auto;
      }

      .spacer {
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <header style="padding: 24px 16px; border-bottom: 1px solid var(--border);">
      <div style="max-width: 1200px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
          <div>
            <h1 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 4px;">Generate PDF with Your Images and Text</h1>
            <p style="color: var(--text3); font-size: 0.875rem;">Upload images, write text under each, and click "Print".</p>
          </div>
          <a href="index.html" class="btn btn-ghost" style="text-decoration: none;">
            <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 12l9-9m-9 9l9 9" />
            </svg>
            Back to Home
          </a>
        </div>
      </div>
    </header>

    <main style="padding-top: 24px;">
      <div class="controls" style="max-width: 1200px; margin: 0 auto 24px; padding: 0 16px; display: flex; gap: 12px; align-items: center;">
        <button id="chooseFiles" type="button" class="btn btn-primary" style="display: flex; align-items: center; gap: 6px;">
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17,8 12,3 7,8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Choose Files
        </button>
        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
          style="display: none"
        />
        <div class="spacer" style="flex: 1;"></div>
        <button id="print" type="button" class="btn btn-primary" style="display: none; min-width: 96px;">
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 6,2 18,2 18,9" />
            <path d="M6,18H4a2,2,0,0,1-2-2V7A2,2,0,0,1,4,5H20a2,2,0,0,1,2,2v9a2,2,0,0,1-2,2H18" />
            <rect x="6" y="14" width="12" height="8" rx="2" />
          </svg>
          Print
        </button>
        <button
          id="toggleMode"
          type="button"
          data-mode="edit"
          class="btn btn-ghost"
          style="display: none; min-width: 110px;"
        >
          <svg style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          Mode: Edit
        </button>
      </div>

      <div id="preview" class="preview" aria-live="polite"></div>
    </main>

    <script>
      const fileInput = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const toggleModeBtn = document.getElementById("toggleMode");
      const printBtn = document.getElementById("print");
      const chooseFilesBtn = document.getElementById("chooseFiles");

      chooseFilesBtn.addEventListener("click", () => fileInput.click());

      let isEditMode = true;

      function updateControlsVisibility() {
        const hasItems = preview.children.length > 0;
        toggleModeBtn.style.display = hasItems ? "inline-flex" : "none";
        printBtn.style.display = hasItems ? "inline-flex" : "none";
      }

      function setEditMode(on) {
        isEditMode = !!on;

        // Update overlays from textarea values when switching to readonly.
        if (!isEditMode) {
          preview.querySelectorAll(".item").forEach((item) => {
            const textarea = item.querySelector("textarea");
            const overlay = item.querySelector(".overlay");
            if (textarea && overlay) {
              overlay.textContent = textarea.value;
            }
          });
        }

        document.body.classList.toggle("readonly-mode", !isEditMode);
        toggleModeBtn.textContent = isEditMode
          ? "Mode: Edit"
          : "Mode: Read-Only";

        updateControlsVisibility();
      }

      toggleModeBtn.addEventListener("click", () => setEditMode(!isEditMode));

      // Initial state
      updateControlsVisibility();

      function createItem(imageUrl) {
        const item = document.createElement("div");
        item.className = "item";

        const imageWrapper = document.createElement("div");
        imageWrapper.className = "imageWrapper";

        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = "Uploaded image";
        imageWrapper.appendChild(img);

        const overlay = document.createElement("div");
        overlay.className = "overlay";
        imageWrapper.appendChild(overlay);

        item.appendChild(imageWrapper);

        const textarea = document.createElement("textarea");
        textarea.placeholder = "Enter text for this image...";
        textarea.addEventListener("input", () => {
          overlay.textContent = textarea.value;
        });
        item.appendChild(textarea);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          item.remove();
          updateControlsVisibility();
        });
        item.appendChild(remove);

        return item;
      }

      fileInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;

        for (const file of files) {
          if (!file.type.startsWith("image/")) continue;
          const url = URL.createObjectURL(file);
          const item = createItem(url);
          preview.appendChild(item);

          // Revoke once loaded for memory
          const img = item.querySelector("img");
          img.addEventListener("load", () => URL.revokeObjectURL(url));
        }

        // Reset so same file can be re-added if needed
        fileInput.value = "";

        updateControlsVisibility();
      });

      printBtn.addEventListener("click", () => {
        // Copy textarea values to overlays before printing
        preview.querySelectorAll(".item").forEach((item) => {
          const textarea = item.querySelector("textarea");
          const overlay = item.querySelector(".overlay");
          if (textarea && overlay) {
            overlay.textContent = textarea.value;
          }
        });
        window.print();
      });
    </script>
  </body>
</html>
